name: Build day

on:
  push:
    branches: [main]
    paths: ["drafts/*.json"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Draft to (re)build, e.g. drafts/2026-11-23.json"
        required: true

permissions:
  contents: write

concurrency:
  group: build-day
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Render images and queue
        env:
          DRAFT_INPUT: ${{ inputs.draft }}
        run: |
          if [ -n "$DRAFT_INPUT" ]; then
            files="$DRAFT_INPUT"
          else
            files=$(git diff --name-only HEAD~1 HEAD -- 'drafts/*.json')
          fi
          for f in $files; do
            case "$f" in drafts/*.json) ;; *) echo "skip $f"; continue ;; esac
            [ -f "$f" ] || continue
            echo "== $f"
            python go24/build_day.py "$f"
          done

      - name: Commit results
        run: |
          git config user.name "go24-bot"
          git config user.email "go24-bot@users.noreply.github.com"
          git add media queue
          if ! git diff --cached --quiet; then
            git commit -m "build: images and queue"
            git pull --rebase --autostash
            git push
          fi
