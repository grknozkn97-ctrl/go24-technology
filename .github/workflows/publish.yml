name: Publish to Instagram

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Publish this post id right now (optional)"
        required: false
        default: ""
      dry_run:
        description: "Only show what would be published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish due posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          POST_ID: ${{ inputs.post_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python go24/publish.py

      - name: Save state
        if: always()
        run: |
          git config user.name "go24-bot"
          git config user.email "go24-bot@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "state: publish run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
